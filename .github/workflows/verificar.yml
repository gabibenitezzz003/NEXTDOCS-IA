name: Verificar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: nextdocs
          POSTGRES_PASSWORD: nextdocs
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U nextdocs -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: nextdocs
          MINIO_ROOT_PASSWORD: nextdocs123
        command: server /data
        ports:
          - 9102:9000
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users.login=email"
        ports:
          - 3027:3025
          - 3145:3143
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Esperar MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9102/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO no respondio" >&2
          exit 1
      - name: Verificar
        working-directory: backend
        env:
          NEXTDOCS_PRUEBA_OBLIGATORIA: "true"
          NEXTDOCS_PRUEBA_BD_HOST: 127.0.0.1
          NEXTDOCS_PRUEBA_BD_PUERTO: "5434"
          NEXTDOCS_PRUEBA_BD_USUARIO: nextdocs
          NEXTDOCS_PRUEBA_BD_CLAVE: nextdocs
          NEXTDOCS_PRUEBA_REDIS_HOST: 127.0.0.1
          NEXTDOCS_PRUEBA_REDIS_PUERTO: "6381"
          NEXTDOCS_PRUEBA_S3_ENDPOINT: http://127.0.0.1:9102
          NEXTDOCS_PRUEBA_CORREO_HOST: 127.0.0.1
          NEXTDOCS_PRUEBA_CORREO_SMTP: "3027"
          NEXTDOCS_PRUEBA_CORREO_IMAP: "3145"
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/apache-maven-3.9.9/bin:$PATH"
          mvn -B verify

  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: nextdocs-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
