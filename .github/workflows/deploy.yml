name: Desplegar

on:
  workflow_run:
    workflows: ["Verificar"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit o ref a desplegar (vacio = main actual)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

env:
  INSTANCIA: i-08d32d6d1248553aa
  BASE_RDS: nextdocs-ia-prod
  AWS_REGION: us-east-1

jobs:
  desplegar:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolver commit objetivo
        id: objetivo
        env:
          REF_MANUAL: ${{ inputs.ref }}
          SHA_VERIFICADO: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            OBJETIVO="$SHA_VERIFICADO"
          elif [ -n "$REF_MANUAL" ]; then
            OBJETIVO="$REF_MANUAL"
          else
            OBJETIVO="$GITHUB_SHA"
          fi
          if ! printf '%s' "$OBJETIVO" | grep -qE '^[a-zA-Z0-9._/-]+$'; then
            echo "Referencia invalida: $OBJETIVO" >&2
            exit 1
          fi
          echo "sha=$OBJETIVO" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Snapshot de RDS previo al despliegue
        run: |
          SNAPSHOT="nextdocs-deploy-$(date -u +%Y%m%d%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier "$BASE_RDS" \
            --db-snapshot-identifier "$SNAPSHOT" \
            --query 'DBSnapshot.DBSnapshotIdentifier' --output text

      - name: Ejecutar deploy.sh en la instancia
        id: comando
        env:
          OBJETIVO: ${{ steps.objetivo.outputs.sha }}
        run: |
          COMANDO=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "deploy $OBJETIVO" \
            --parameters "{\"commands\":[\"install -d -o ubuntu -g ubuntu /var/lib/nextdocs-ia\",\"sudo -u ubuntu -H bash -lc 'set -o pipefail; cd /opt/nextdocs-ia/app && ./deploy.sh --ref $OBJETIVO 2>&1 | tee /var/lib/nextdocs-ia/ultimo-deploy.log'\"],\"executionTimeout\":[\"2400\"]}" \
            --query 'Command.CommandId' --output text)
          echo "comando=$COMANDO" >> "$GITHUB_OUTPUT"
          echo "CommandId: $COMANDO"

      - name: Esperar el resultado del despliegue
        env:
          COMANDO: ${{ steps.comando.outputs.comando }}
        run: |
          while true; do
            ESTADO=$(aws ssm get-command-invocation \
              --command-id "$COMANDO" --instance-id "$INSTANCIA" \
              --query 'Status' --output text)
            case "$ESTADO" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done
          echo "=== Estado final: $ESTADO ==="
          aws ssm get-command-invocation \
            --command-id "$COMANDO" --instance-id "$INSTANCIA" \
            --query 'StandardOutputContent' --output text || true
          if [ "$ESTADO" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMANDO" --instance-id "$INSTANCIA" \
              --query 'StandardErrorContent' --output text >&2 || true
            echo "El log completo quedo en /var/lib/nextdocs-ia/ultimo-deploy.log" >&2
            exit 1
          fi
