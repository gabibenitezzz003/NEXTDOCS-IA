services:

  app:
    build:
      context: /opt/nextdocs-ia/app/backend
      dockerfile: Dockerfile
    container_name: nextdocs-ia-app
    restart: unless-stopped
    env_file:
      - /etc/nextdocs-ia/nextdocs.env
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - nextdocs-interno
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8090/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nextdocs-ia-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    networks:
      - nextdocs-interno
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clamav:
    image: clamav/clamav:1.4
    container_name: nextdocs-ia-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - nextdocs-interno
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - clamdscan --ping 3
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  workflow:
    build:
      context: /opt/nextdocs-ia/workflow
      dockerfile: Dockerfile
    container_name: nextdocs-ia-workflow
    restart: unless-stopped
    environment:
      NEXTDOCS_BD_URL: jdbc:postgresql://nextdocs-ia-prod.cspyua8o6elx.us-east-1.rds.amazonaws.com:5432/nextdocs_workflow
      NEXTDOCS_BD_USUARIO: ${NEXTDOCS_BD_USUARIO}
      NEXTDOCS_BD_CLAVE: ${NEXTDOCS_BD_CLAVE}
      NEXTDOCS_WORKFLOW_SEGURIDAD_JWT_HABILITADA: "true"
      NEXTDOCS_JWT_SECRETO: ${NEXTDOCS_JWT_SECRETO}
      NEXTDOCS_JWT_EMISOR: nextdocs-ai
      NEXTDOCS_WORKFLOW_FIXTURES_HABILITADO: "false"
      NEXTDOCS_WORKFLOW_DOCUMENTAL_URL_BASE: ${NEXTDOCS_WORKFLOW_DOCUMENTAL_URL_BASE}
      NEXTDOCS_WORKFLOW_DOCUMENTAL_CLAVES: ${NEXTDOCS_WORKFLOW_DOCUMENTAL_CLAVES}
      NEXTDOCS_WORKFLOW_DOCUMENTAL_EVENTOS_SECRETO: ${NEXTDOCS_WORKFLOW_DOCUMENTAL_EVENTOS_SECRETO:-}
      NEXTDOCS_WORKFLOW_FIRMA_URL_BASE: ${NEXTDOCS_WORKFLOW_FIRMA_URL_BASE}
      NEXTDOCS_WORKFLOW_FIRMA_URL_PUBLICA: ${NEXTDOCS_WORKFLOW_FIRMA_URL_PUBLICA}
      NEXTDOCS_WORKFLOW_FIRMA_WEBHOOK_SECRETO: ${NEXTDOCS_WORKFLOW_FIRMA_WEBHOOK_SECRETO}
      NEXTDOCS_WORKFLOW_FIRMA_CLAVES: ${NEXTDOCS_WORKFLOW_FIRMA_CLAVES}
      NEXTDOCS_WORKFLOW_COMEX_HABILITADO: ${NEXTDOCS_WORKFLOW_COMEX_HABILITADO:-false}
      NEXTDOCS_WORKFLOW_COMEX_TENANT_ID: ${NEXTDOCS_WORKFLOW_COMEX_TENANT_ID:-}
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      - nextdocs-interno
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8091/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

  documenso:
    image: documenso-firma:v2.18.0
    container_name: nextdocs-ia-documenso
    restart: unless-stopped
    environment:
      PORT: "3000"
      NEXTAUTH_SECRET: ${DOCUMENSO_AUTH_SECRETO}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRIPTACION_CLAVE}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRIPTACION_CLAVE_2}
      NEXT_PUBLIC_WEBAPP_URL: https://nextdocsia.fenixgroup.tech/firma
      NEXT_PUBLIC_BASE_PATH: /firma
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://127.0.0.1:3000/firma
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:${DOCUMENSO_BD_CLAVE}@nextdocs-ia-prod.cspyua8o6elx.us-east-1.rds.amazonaws.com:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:${DOCUMENSO_BD_CLAVE}@nextdocs-ia-prod.cspyua8o6elx.us-east-1.rds.amazonaws.com:5432/documenso
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_JOBS_PROVIDER: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_FIRMA_FRASE}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: 127.0.0.1
      NEXT_PRIVATE_SMTP_PORT: "25"
      NEXT_PRIVATE_SMTP_USERNAME: sin-smtp
      NEXT_PRIVATE_SMTP_PASSWORD: sin-smtp
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: firma@fenixgroup.tech
      DOCUMENSO_DISABLE_TELEMETRY: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /etc/nextdocs-ia/documenso/cert.p12:/opt/documenso/cert.p12:ro
    networks:
      - nextdocs-interno
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  documental-api:
    build:
      context: /opt/nextdocs-ia/documental
      dockerfile: Dockerfile
    image: nextdocs-documental:prod
    container_name: nextdocs-ia-documental-api
    restart: unless-stopped
    command: ["node", "apps/api/dist/principal.js"]
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null http://127.0.0.1:4000/salud || exit 1
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    environment:
      NODE_ENV: production
      POSTGRES_URL: ${NEXTDOCS_DOCUMENTAL_BD_URL}
      POSTGRES_SSL: "true"
      REDIS_URL: redis://redis:6379
      ALMACENAMIENTO_REGION: ${NEXTDOCS_S3_REGION}
      ALMACENAMIENTO_BALDE: ${NEXTDOCS_S3_BUCKET_DOCUMENTOS}
      ALMACENAMIENTO_PREFIJO: documental/
      API_PUERTO: "4000"
      API_URL: http://documental-api:4000
      API_ORIGENES: http://documental-api:4000
      PROVEEDOR_IA: gemini
      GOOGLE_API_KEY: ${NEXTDOCS_GEMINI_CLAVE}
      GEMINI_MODELO: gemini-3.6-flash
      CORREO_ANFITRION: ${NEXTDOCS_CORREO_ANFITRION:-}
      CORREO_PUERTO: ${NEXTDOCS_CORREO_PUERTO:-587}
      CORREO_SEGURO: ${NEXTDOCS_CORREO_SEGURO:-false}
      CORREO_USUARIO: ${NEXTDOCS_CORREO_USUARIO:-}
      CORREO_CLAVE: ${NEXTDOCS_CORREO_CLAVE:-}
      CORREO_REMITENTE: ${NEXTDOCS_CORREO_REMITENTE:-}
      ADMIN_CLAVE: ${NEXTDOCS_DOCUMENTAL_CLAVE_ADMIN:-}
      ARCA_ENTORNO: ${NEXTDOCS_ARCA_ENTORNO:-homologacion}
      ARCA_CUIT: ${NEXTDOCS_ARCA_CUIT:-}
      ARCA_CERTIFICADO_RUTA: /run/secretos/arca.crt
      ARCA_CLAVE_PRIVADA_RUTA: /run/secretos/arca.key
    volumes:
      - /etc/nextdocs-ia/secretos:/run/secretos:ro
    ports:
      - "127.0.0.1:4002:4000"
    networks:
      - nextdocs-interno

  documental-worker:
    build:
      context: /opt/nextdocs-ia/documental
      dockerfile: Dockerfile
    image: nextdocs-documental:prod
    container_name: nextdocs-ia-documental-worker
    restart: unless-stopped
    command: ["node", "apps/worker/dist/principal.js"]
    healthcheck:
      test:
        - CMD-SHELL
        - ps -eo args | grep -q "[a]pps/worker/dist/principal.js"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    environment:
      NODE_ENV: production
      POSTGRES_URL: ${NEXTDOCS_DOCUMENTAL_BD_URL}
      POSTGRES_SSL: "true"
      REDIS_URL: redis://redis:6379
      ALMACENAMIENTO_REGION: ${NEXTDOCS_S3_REGION}
      ALMACENAMIENTO_BALDE: ${NEXTDOCS_S3_BUCKET_DOCUMENTOS}
      ALMACENAMIENTO_PREFIJO: documental/
      PROVEEDOR_IA: gemini
      GOOGLE_API_KEY: ${NEXTDOCS_GEMINI_CLAVE}
      GEMINI_MODELO: gemini-3.6-flash
      CORREO_ANFITRION: ${NEXTDOCS_CORREO_ANFITRION:-}
      CORREO_PUERTO: ${NEXTDOCS_CORREO_PUERTO:-587}
      CORREO_SEGURO: ${NEXTDOCS_CORREO_SEGURO:-false}
      CORREO_USUARIO: ${NEXTDOCS_CORREO_USUARIO:-}
      CORREO_CLAVE: ${NEXTDOCS_CORREO_CLAVE:-}
      CORREO_REMITENTE: ${NEXTDOCS_CORREO_REMITENTE:-}
      NEXTDOCS_URL_PUBLICA: ${NEXTDOCS_URL_PUBLICA:-https://nextdocsia.fenixgroup.tech}
      ARCA_ENTORNO: ${NEXTDOCS_ARCA_ENTORNO:-homologacion}
      ARCA_CUIT: ${NEXTDOCS_ARCA_CUIT:-}
      ARCA_CERTIFICADO_RUTA: /run/secretos/arca.crt
      ARCA_CLAVE_PRIVADA_RUTA: /run/secretos/arca.key
      WORKER_CONCURRENCIA: "2"
    volumes:
      - /etc/nextdocs-ia/secretos:/run/secretos:ro
    networks:
      - nextdocs-interno

networks:
  nextdocs-interno:
    driver: bridge

volumes:
  redis_data:
    name: nextdocs-ia-redis-data
  clamav_data:
    name: nextdocs-ia-clamav-data
