spring:
  application:
    name: nextdocs-ai
  datasource:
    url: ${NEXTDOCS_BD_URL:jdbc:postgresql://localhost:5434/nextdocs}
    username: ${NEXTDOCS_BD_USUARIO:nextdocs}
    password: ${NEXTDOCS_BD_CLAVE:nextdocs}
    hikari:
      maximum-pool-size: ${NEXTDOCS_BD_POOL_MAXIMO:20}
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${NEXTDOCS_REDIS_HOST:localhost}
      port: ${NEXTDOCS_REDIS_PUERTO:6381}
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${NEXTDOCS_PUERTO:8090}
  servlet:
    context-path: /
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

nextdocs:
  seguridad:
    jwtSecreto: ${NEXTDOCS_JWT_SECRETO:cambiar-este-secreto-en-produccion-minimo-32-bytes}
    jwtEmisor: nextdocs-ai
    jwtDuracionMinutos: ${NEXTDOCS_JWT_DURACION_MINUTOS:480}
    jwtDuracionRefrescoDias: ${NEXTDOCS_JWT_DURACION_REFRESCO_DIAS:7}
    rutasPublicas:
      - /api/v1/autenticacion/**
      - /api/v1/federacion/intercambio
      - /api/v1/federacion/canje
      - /api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
  almacenamiento:
    endpoint: ${NEXTDOCS_S3_ENDPOINT:http://localhost:9102}
    region: ${NEXTDOCS_S3_REGION:us-east-1}
    claveAcceso: ${NEXTDOCS_S3_CLAVE_ACCESO:nextdocs}
    claveSecreta: ${NEXTDOCS_S3_CLAVE_SECRETA:nextdocs123}
    bucketDocumentos: ${NEXTDOCS_S3_BUCKET_DOCUMENTOS:nextdocs-documentos}
    bucketExportaciones: ${NEXTDOCS_S3_BUCKET_EXPORTACIONES:nextdocs-exportaciones}
    bucketCuarentena: ${NEXTDOCS_S3_BUCKET_CUARENTENA:nextdocs-cuarentena}
    rutaEstiloForzado: true
    duracionUrlFirmadaMinutos: 15
  ingesta:
    tamanoMaximoBytes: 52428800
    tiposMimePermitidos:
      - application/pdf
      - image/png
      - image/jpeg
      - image/tiff
      - image/webp
    extensionesPermitidas:
      - pdf
      - png
      - jpg
      - jpeg
      - tif
      - tiff
      - webp
  limite-uso:
    activo: ${NEXTDOCS_LIMITE_ACTIVO:true}
    peticionesPorMinutoPorPrincipal: ${NEXTDOCS_LIMITE_PRINCIPAL:300}
    peticionesPorMinutoPorTenant: ${NEXTDOCS_LIMITE_TENANT:1200}
    ingestasPorMinutoPorTenant: ${NEXTDOCS_LIMITE_INGESTA:60}
    rutasIngesta:
      - /api/v1/documentos
    rutasExentas:
      - /api/v1/autenticacion/**
      - /actuator/**
      - /api-docs/**
      - /swagger-ui/**
  antivirus:
    motor: ${NEXTDOCS_ANTIVIRUS_MOTOR:PERMISIVO}
    host: ${NEXTDOCS_ANTIVIRUS_HOST:localhost}
    puerto: ${NEXTDOCS_ANTIVIRUS_PUERTO:3310}
    tiempoEsperaMilisegundos: ${NEXTDOCS_ANTIVIRUS_ESPERA:30000}
    tamanoBloque: 32768
    rechazarSiNoDisponible: ${NEXTDOCS_ANTIVIRUS_RECHAZAR_SI_CAIDO:true}
    permitirSinAnalisis: ${NEXTDOCS_ANTIVIRUS_PERMITIR_SIN_ANALISIS:false}
  proveedor-ia:
    proveedorPorDefecto: ${NEXTDOCS_IA_PROVEEDOR:SIMULADO}
    intentosMaximos: 4
    esperaInicialMilisegundos: 1000
    multiplicadorEspera: 2.0
    esperaMaximaMilisegundos: 60000
    umbralCircuitoAbierto: 5
    duracionCircuitoAbiertoSegundos: 60
  cola:
    nombreExtraccion: nextdocs:cola:extraccion
    nombreReintento: nextdocs:cola:reintento
    concurrenciaTrabajadores: ${NEXTDOCS_COLA_CONCURRENCIA:4}
    intervaloSondeoMilisegundos: 1000
  webhooks:
    despachadorActivo: ${NEXTDOCS_WEBHOOK_DESPACHADOR:true}
    intentosMaximos: 6
    tiempoEsperaSegundos: 15
    umbralPausa: ${NEXTDOCS_WEBHOOK_UMBRAL_PAUSA:10}
    permitirLocalhost: ${NEXTDOCS_WEBHOOK_LOCALHOST:false}
  retencion:
    trabajadorActivo: ${NEXTDOCS_RETENCION_ACTIVA:true}
    documentosPorCiclo: ${NEXTDOCS_RETENCION_POR_CICLO:100}
    intervaloMilisegundos: ${NEXTDOCS_RETENCION_INTERVALO_MS:3600000}
    demoraInicialMilisegundos: 60000
  federacion:
    tiempoEsperaMilisegundos: ${NEXTDOCS_FEDERACION_TIMEOUT_MS:8000}
    segundosCacheJwks: ${NEXTDOCS_FEDERACION_CACHE_JWKS:600}
    toleranciaRelojSegundos: ${NEXTDOCS_FEDERACION_RELOJ:60}
    segundosVigenciaCodigo: ${NEXTDOCS_FEDERACION_VIGENCIA_CODIGO:60}
    exigirEmisorSeguro: ${NEXTDOCS_FEDERACION_EXIGIR_HTTPS:true}
    intervaloLimpiezaMilisegundos: 900000
    retrasoInicialMilisegundos: 60000
  clasificacion:
    activa: ${NEXTDOCS_CLASIFICACION_ACTIVA:true}
    confianzaMinima: ${NEXTDOCS_CLASIFICACION_CONFIANZA_MINIMA:0.60}
    maximoCandidatos: ${NEXTDOCS_CLASIFICACION_MAXIMO_CANDIDATOS:40}
  auditoria:
    registrarAccesoLectura: true
  arranque:
    crearTenantDemostracion: ${NEXTDOCS_CREAR_TENANT_DEMO:false}
    codigoTenant: ${NEXTDOCS_TENANT_DEMO_CODIGO:demo}
    nombreTenant: ${NEXTDOCS_TENANT_DEMO_NOMBRE:Tenant de demostracion}
    emailAdministrador: ${NEXTDOCS_TENANT_DEMO_EMAIL:admin@nextdocs.ai}
    claveAdministrador: ${NEXTDOCS_TENANT_DEMO_CLAVE:nextdocs123}

logging:
  level:
    root: INFO
    com.nextdocs.ai: ${NEXTDOCS_LOG_NIVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlacionId}] %logger{36} - %msg%n"
