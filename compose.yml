services:

  postgres:
    image: postgres:16-alpine
    container_name: nextdocs-postgres
    environment:
      POSTGRES_DB: nextdocs
      POSTGRES_USER: nextdocs
      POSTGRES_PASSWORD: nextdocs
    ports:
      - "5434:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextdocs -d nextdocs"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16-alpine
    container_name: nextdocs-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: nextdocs
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U nextdocs -d postgres -v ON_ERROR_STOP=1 -tAc \"SELECT 1 FROM pg_database WHERE datname = 'nextdocs_workflow'\" | grep -q 1
      || psql -h postgres -U nextdocs -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nextdocs_workflow'
      "

  redis:
    image: redis:7-alpine
    container_name: nextdocs-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: nextdocs-minio
    command: ["server", "/data", "--console-address", ":9101"]
    environment:
      MINIO_ROOT_USER: nextdocs
      MINIO_ROOT_PASSWORD: nextdocs123
    ports:
      - "9102:9000"
      - "9101:9101"
    volumes:
      - minio-datos:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: nextdocs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nextdocs nextdocs123;
      mc mb --ignore-existing local/nextdocs-documentos;
      mc mb --ignore-existing local/nextdocs-exportaciones;
      mc mb --ignore-existing local/nextdocs-cuarentena;
      mc anonymous set none local/nextdocs-documentos;
      mc anonymous set none local/nextdocs-cuarentena;
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: nextdocs-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8089"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8089:8089"

  app:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nextdocs-ai:local
    container_name: nextdocs-app
    env_file:
      - path: .env
        required: false
    environment:
      NEXTDOCS_BD_URL: jdbc:postgresql://postgres:5432/nextdocs
      NEXTDOCS_BD_USUARIO: nextdocs
      NEXTDOCS_BD_CLAVE: nextdocs
      NEXTDOCS_REDIS_HOST: redis
      NEXTDOCS_REDIS_PUERTO: "6379"
      NEXTDOCS_S3_ENDPOINT: http://minio:9000
      NEXTDOCS_S3_ENDPOINT_PUBLICO: http://localhost:9102
      NEXTDOCS_S3_CLAVE_ACCESO: nextdocs
      NEXTDOCS_S3_CLAVE_SECRETA: nextdocs123
      NEXTDOCS_ANTIVIRUS_HOST: clamav
      NEXTDOCS_FEDERACION_EXIGIR_HTTPS: "false"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  workflow:
    profiles: ["workflow"]
    build:
      context: ../workflow
      dockerfile: Dockerfile
    image: nextdocs-workflow:local
    container_name: nextdocs-workflow
    environment:
      NEXTDOCS_BD_URL: jdbc:postgresql://postgres:5432/nextdocs_workflow
      NEXTDOCS_BD_USUARIO: nextdocs
      NEXTDOCS_BD_CLAVE: nextdocs
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  clamav:
    image: clamav/clamav:stable
    container_name: nextdocs-clamav
    profiles: ["antivirus"]
    ports:
      - "3310:3310"
    volumes:
      - clamav-datos:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  postgres-datos:
  redis-datos:
  minio-datos:
  clamav-datos:
