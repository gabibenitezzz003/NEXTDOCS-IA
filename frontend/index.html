<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6C36FF" />
    <script>
      // Antes de pintar: evita el destello de tema claro al recargar en oscuro.
      (function () {
        try {
          var guardado = localStorage.getItem("nd-tema");
          var tema =
            guardado === "light" || guardado === "dark"
              ? guardado
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-nd-theme", tema);
        } catch (e) {
          document.documentElement.setAttribute("data-nd-theme", "light");
        }
      })();
    </script>
    <title>NEXT DOC AI</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/principal.tsx"></script>
  </body>
</html>
